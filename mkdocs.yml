site_name: Kelp
site_description: >-
  Documentation for Kelp: a statically typed, compiled systems language whose
  headline feature is capability-based security.
site_url: https://homelabone.xenoo.dev/kelp/
repo_url: https://homelabone.xenoo.dev/gittea/Juniper/kelp
repo_name: Juniper/kelp
edit_uri: ""
copyright: Kelp — Juniper

hooks:
  - hooks/kelp_lexer.py

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  generator: false

# Every warning is fatal under --strict, including a forward link, so a link to a
# page that does not exist yet fails the build rather than publishing quietly.
validation:
  links:
    not_found: warn
    absolute_links: ignore
    unrecognized_links: ignore

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        # Mermaid diagrams: the script is vendored below, so a diagram renders
        # without a CDN and the site works on a LAN with no internet.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mermaid.min.js

nav:
